services:
  unoserver:
    # 使用官方或社区维护的libreoffice-unoserver镜像
    image: docker.1ms.run/libreofficedocker/libreoffice-unoserver:3.18
    # 容器名称，方便管理
    container_name: libreoffice-unoserver
    # 重启策略：异常退出时自动重启
    restart: no
    # 资源限制，避免占用过多主机资源
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    # restful暴露端口
    ports:
      - "2004:2004"
    # 持久化目录：用于文件转换的临时存储
    volumes:
      - ./libreoffice:/data
    # 环境变量配置
    environment:
      # 设置语言编码，避免中文乱码
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      # 设置LibreOffice无界面运行
      - UNOSERVER_ARGS=--interface 0.0.0.0 --port 2002 --headless
